# 生产 override（§13）：
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# 效果：开发端口映射被【替换】（!override），web 绑定 WG 内网 10.10.0.1:8443 终止 TLS；
#       证书须包含 IP SAN 10.10.0.1（prod-certs/fullchain.pem + privkey.pem）；
#       WG 接口建立后再启动。API/DB 均不发布端口。
# 首次生成自签证书（含 IP SAN，仅内网管理面使用）：
#   openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes \
#     -keyout prod-certs/privkey.pem -out prod-certs/fullchain.pem -days 825 \
#     -subj "/CN=10.10.0.1" -addext "subjectAltName=IP:10.10.0.1"
services:
  web:
    ports: !override
      - "10.10.0.1:8443:8443"
    volumes:
      - ./prod-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./prod-certs:/etc/nginx/certs:ro
  api:
    environment:
      APP_ENV: prod
      MGMT_PUBLIC_URL: https://10.10.0.1:8443
    volumes:
      # agent 升级包（deploy 侧 /opt/mgmt/build-agent-bundle.sh 构建），容器内只读
      - /opt/mgmt/agent-bundles:/srv/bundles:ro
