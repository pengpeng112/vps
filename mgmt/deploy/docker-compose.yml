# 路由器管理台 — 开发 compose（任务书 §13）
# 生产用 docker-compose.prod.yml 覆盖（替换端口映射，不叠加）：
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
name: routermgmt

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必填}
      MIGRATE_PASSWORD: ${MIGRATE_PASSWORD:?MIGRATE_PASSWORD 必填}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD 必填}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    # 不映射宿主机端口（§11.1）；本机调试可 docker compose exec db psql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d routermgmt"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [mgmt]

  migrate:
    build: ../backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      MIGRATE_DATABASE_URL: postgres://mgmt_migrate:${MIGRATE_PASSWORD:?MIGRATE_PASSWORD 必填}@db:5432/routermgmt?sslmode=disable
    command: ["-migrate"]
    restart: "no"
    networks: [mgmt]

  api:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-dev}
      LISTEN: 0.0.0.0:8443            # 仅容器网络访问，不发布宿主机端口
      DATABASE_URL: postgres://mgmt_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD 必填}@db:5432/routermgmt?sslmode=disable
      DATA_DIR: /data
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 必填}
      MASTER_KEY: ${MASTER_KEY:?MASTER_KEY 必填}
      BOOTSTRAP_ADMIN: ${BOOTSTRAP_ADMIN:?BOOTSTRAP_ADMIN 必填}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?BOOTSTRAP_PASSWORD 必填}
      MGMT_PUBLIC_URL: ${MGMT_PUBLIC_URL:-https://10.10.0.1:8443}
      WG_HUB_PUBLIC_KEY: ${WG_HUB_PUBLIC_KEY:-}
      WG_HUB_ENDPOINT: ${WG_HUB_ENDPOINT:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      TRAFFIC_ALERT_GB: ${TRAFFIC_ALERT_GB:-80}
      # VPS 本机探测器（mgmt-rssh-probe）共享密钥；空=内部路由禁用（阶段1C 2026-09-24）
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
    volumes:
      - mgmtdata:/data
    # 容器内 0.0.0.0；无 ports 映射（生产由 web 终止 TLS 并绑 10.10.0.1:8443）
    networks: [mgmt]

  web:
    build: ../frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"           # 开发：仅本机回环
    networks: [mgmt]

volumes:
  pgdata:
  mgmtdata:

networks:
  mgmt:
    driver: bridge
