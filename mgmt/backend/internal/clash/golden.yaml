# 路由器管理台订阅黄金模板
# 提取自 scripts/clash-config-router.yaml（2026-09-13 版），已删除全部节点凭据
# 与静态节点引用。策略基线见任务书 §3：rules/dns/proxy-groups 顺序不得改乱。
# 渲染器只允许替换 #{{...}} 标记行：节点列表、节点组成员、节点/管理面直连规则。
mixed-port: 7890
redir-port: 7892
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
keep-alive-interval: 15
find-process-mode: off
external-controller: 127.0.0.1:9090

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - localhost
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "ntp.*.com"
    - "stun.*.*"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  # 2026-11-18 fallback 国产化（governance-20261118/03 最小模板修复）：全舰队已实测
  # MATCH,DIRECT 直连域名需本地可解析，国外 DoH 在强管控网络超时（9 台 PASS 验证）；
  # 与现场 fleet-md-device.sh sed 结果一致，防止新发布覆盖现场修复。
  fallback:
    - 223.5.5.5
    - 119.29.29.29
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
    domain:
      - "+.google.com"
      - "+.googleapis.com"
      - "+.gstatic.com"
      - "+.youtube.com"
      - "+.github.com"
      - "+.telegram.org"
  proxy-server-nameserver:
    - 223.5.5.5
    - 8.8.8.8
  nameserver-policy:
    "geosite:cn,private":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    # 2026-11-18 国内业务域不在 geosite:cn 名单（MATCH,DIRECT 直连需本地可解析，
    # fallback 国外 DNS 在强管控网络超时）：强制走国内 DNS（昌乐 bboluo 案例）
    "bboluo.com":
      - 223.5.5.5

proxies:
#{{NODE_PROXIES}}

#{{PROXY_PROVIDERS}}
proxy-groups:
  - name: "PROXY"
    type: select
    proxies:
      - AUTO
#{{GROUP_PROXY_MEMBERS}}
      - DIRECT
  # AIRPORT = 机场订阅兜底（2026-10-31 第4层）：url-test 自动择优；仅 AIRPORT_SUB_URL
  # 配置时渲染。empty-fallback REJECT 防空组直连（Codex 评审）。
#{{AIRPORT_GROUP}}
  # AUTO and nested NODE-PICK use the same overseas HTTPS health target.
  # Domestic Apple reachability cannot prove overseas service availability.
  - name: "AUTO"
    type: fallback
    url: https://www.gstatic.com/generate_204
    interval: 120
    timeout: 4000
    expected-status: 204
    lazy: false
    proxies:
#{{AUTO_MEMBERS}}
  # NODE-PICK = 节点主备（2026-09-27 M03：url-test 改为有序 fallback）：
  # fallback 按成员顺序取第一个健康节点。成员顺序由绑定渲染（primary 在前），
  # 不在模板里硬编码——现网实况（2026-10-02）：R2/R3/R4 交互主用东京
  # BWG-VLESS，视频与大文件走 US-MEDIA（LAX）。旧注释「主用腾讯、备用 DO」已过时。
  # 简单 fallback 无外部质量控制器的防抖/评分能力，边界与限制见 docs/plans
  # 网络计划 §6.1。
  # 2026-10-26 lazy:false + interval 120（BWG 被墙事故复盘）：mihomo fallback 组默认
  # lazy=true——组无流量即暂停探测，节点存活状态停在旧标记，被墙后 17 小时不切换
  # （R4 实证）。lazy:false 强制常测，节点失效 ≤2 分钟内自动落到下一健康成员。
  - name: "NODE-PICK"
    type: fallback
    url: https://www.gstatic.com/generate_204
    interval: 120
    lazy: false
    proxies:
#{{GROUP_AUTO_MEMBERS}}
  - name: "CN-MEDIA"
    type: select
    proxies:
      - DIRECT
  - name: "DOWNLOAD"
    type: select
    proxies:
      - DIRECT
      - PROXY
  # Explicit members: available LAX nodes first, then NODE-PICK.
  # include-all excludes groups and previously produced COMPATIBLE without LAX.
  - name: "US-MEDIA"
    type: select
    url: https://www.gstatic.com/generate_204
    interval: 300
    lazy: false
    timeout: 4000
    expected-status: 204
    proxies:
#{{MEDIA_MEMBERS}}
  # FOREIGN-DL（2026-11-19 Batch2，governance-20261119/02 Q2.1）：国外大下载专用组，
  # 与 US-MEDIA（纯视频）互相独立。PoC 阶段成员=PROXY（全速走普通出口）；
  # Batch3 enforce 时由平台渲染切 QOS-DL-GATE（60/100kbit 共享桶）。
  # 只挂海外大下载精确子域；Steam/WindowsUpdate/Apple 等国内可直连更新仍归 DOWNLOAD=DIRECT。
  - name: "FOREIGN-DL"
    type: select
    url: https://www.gstatic.com/generate_204
    interval: 300
    lazy: false
    timeout: 4000
    expected-status: 204
    proxies:
      - PROXY

rules:
#{{NODE_DIRECT_RULES}}
  # 2026-10-29 政企业务系统强制直连（昌乐实测：阿里云高防域名 GeoIP 误判海外→走代理→站点拒访）
  # 2026-11-17 昌乐/东营系业务站批量补录（GeoIP 新段未收录，兜底代理致站点拒访，同款机制）
  # 2026-11-18 bboluo.com（用户确认国内站；注意需配合 dns.nameserver-policy 国内解析，见 dns 段）
  - DOMAIN-SUFFIX,istarshine.com,DIRECT
  - DOMAIN-SUFFIX,bboluo.com,DIRECT
  - DOMAIN-SUFFIX,antdu.net,DIRECT
  - DOMAIN-SUFFIX,dlbrowser.com,DIRECT
  - DOMAIN-SUFFIX,qhupdate.com,DIRECT
  - DOMAIN-SUFFIX,hlquant.com,DIRECT
  - DOMAIN-SUFFIX,xxcg.com,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - GEOSITE,private,DIRECT

  # 国内视频/短视频/直播 —— 禁止走节点
  - GEOSITE,bilibili,CN-MEDIA
  - GEOSITE,iqiyi,CN-MEDIA
  - GEOSITE,youku,CN-MEDIA
  - GEOSITE,bytedance,CN-MEDIA
  - DOMAIN-SUFFIX,bilivideo.com,CN-MEDIA
  - DOMAIN-SUFFIX,hdslb.com,CN-MEDIA
  - DOMAIN-SUFFIX,iqiyi.com,CN-MEDIA
  - DOMAIN-SUFFIX,iqiyipic.com,CN-MEDIA
  - DOMAIN-SUFFIX,youku.com,CN-MEDIA
  - DOMAIN-SUFFIX,ykimg.com,CN-MEDIA
  - DOMAIN-SUFFIX,v.qq.com,CN-MEDIA
  - DOMAIN-SUFFIX,video.qq.com,CN-MEDIA
  - DOMAIN-SUFFIX,mgtv.com,CN-MEDIA
  - DOMAIN-SUFFIX,hitv.com,CN-MEDIA
  - DOMAIN-SUFFIX,douyin.com,CN-MEDIA
  - DOMAIN-SUFFIX,douyinvod.com,CN-MEDIA
  - DOMAIN-SUFFIX,amemv.com,CN-MEDIA
  - DOMAIN-SUFFIX,byteimg.com,CN-MEDIA
  - DOMAIN-SUFFIX,ixigua.com,CN-MEDIA
  - DOMAIN-SUFFIX,kuaishou.com,CN-MEDIA
  - DOMAIN-SUFFIX,yximgs.com,CN-MEDIA
  - DOMAIN-SUFFIX,xiaohongshu.com,CN-MEDIA
  - DOMAIN-SUFFIX,xhscdn.com,CN-MEDIA

  # 国内互联网
  - GEOSITE,tencent,DIRECT
  - GEOSITE,alibaba,DIRECT
  - GEOSITE,baidu,DIRECT
  - GEOSITE,netease,DIRECT
  - GEOSITE,xiaomi,DIRECT
  - GEOSITE,apple-cn,DIRECT
  # gstatic 资源域：google-cn 名单把它判 DIRECT，但办公网下 mihomo DNS fallback
  # 可能给出境外不可达答案（09-27 实测 SN-R1 得 142.251.12.94 直连超时），
  # 强制走代理且必须先于 GEOSITE,google-cn 命中（统一优化 M02）；
  # dl.google.com 于 2026-11-19 Batch2 按 02-Q2.1 改入 FOREIGN-DL（海外大下载类，先于 google-cn 语义保持）
  - DOMAIN-SUFFIX,gstatic.com,PROXY
  - DOMAIN-SUFFIX,dl.google.com,FOREIGN-DL
  - GEOSITE,google-cn,DIRECT
  - GEOSITE,category-games@cn,DIRECT
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT,no-resolve
  # 专线/内网业务域名：公网 geosite 清单不收录，GEOIP,no-resolve 对域名不生效，
  # 不显式直连会落入 MATCH,PROXY 出国回访内网端口被拒（2026-09-26 ydbi.sdent.com.cn:29080 案例）
  - DOMAIN-SUFFIX,sdent.com.cn,DIRECT

  # 大流量下载默认直连（省钱）；商店打不开再把 DOWNLOAD 切到 PROXY
  - DOMAIN-SUFFIX,steamcontent.com,DOWNLOAD
  - DOMAIN-SUFFIX,steamserver.net,DOWNLOAD
  - DOMAIN-KEYWORD,steampipe,DOWNLOAD
  - DOMAIN-SUFFIX,windowsupdate.com,DOWNLOAD
  - DOMAIN-SUFFIX,update.microsoft.com,DOWNLOAD
  - DOMAIN-SUFFIX,dl.delivery.mp.microsoft.com,DOWNLOAD
  - DOMAIN-SUFFIX,swcdn.apple.com,DOWNLOAD

  # 海外视频 → US-MEDIA 纯视频分流（2026-10-02 阶段1；2026-11-19 Batch2 按 02-Q2.1 收窄为纯视频：
  # Spotify/GitHub 静态资源移回 PROXY 不限速，海外大下载精确子域移入 FOREIGN-DL）。
  # GEOSITE 类别仅用设备 dat 中已确证存在的 youtube/netflix，其余手工域名（零启动风险）。
  # 顺序在国内直连段之后，不影响国内判定。
  - GEOSITE,youtube,US-MEDIA
  - GEOSITE,netflix,US-MEDIA
  - DOMAIN-SUFFIX,youtube.com,US-MEDIA
  - DOMAIN-SUFFIX,youtu.be,US-MEDIA
  - DOMAIN-SUFFIX,ytimg.com,US-MEDIA
  - DOMAIN-SUFFIX,googlevideo.com,US-MEDIA
  - DOMAIN-SUFFIX,ggpht.com,US-MEDIA
  - DOMAIN-SUFFIX,netflix.com,US-MEDIA
  - DOMAIN-SUFFIX,nflximg.net,US-MEDIA
  - DOMAIN-SUFFIX,nflxvideo.net,US-MEDIA
  - DOMAIN-SUFFIX,nflxext.com,US-MEDIA
  - DOMAIN-SUFFIX,nflxso.net,US-MEDIA
  - DOMAIN-SUFFIX,disneyplus.com,US-MEDIA
  - DOMAIN-SUFFIX,bamgrid.com,US-MEDIA
  - DOMAIN-SUFFIX,dssott.com,US-MEDIA
  - DOMAIN-SUFFIX,primevideo.com,US-MEDIA
  - DOMAIN-SUFFIX,amazonvideo.com,US-MEDIA
  - DOMAIN-SUFFIX,tiktok.com,US-MEDIA
  - DOMAIN-SUFFIX,tiktokcdn.com,US-MEDIA
  - DOMAIN-SUFFIX,tiktokv.com,US-MEDIA
  - DOMAIN-SUFFIX,byteoversea.com,US-MEDIA

  # FOREIGN-DL（2026-11-19 Batch2，Q2.1 精确表）：明确走国外的安装包/仓库发布/网盘下载。
  # 必须先于 githubusercontent.com 的 PROXY 兜底（精确子域优先命中）。
  - DOMAIN-SUFFIX,objects.githubusercontent.com,FOREIGN-DL
  - DOMAIN-SUFFIX,release-assets.githubusercontent.com,FOREIGN-DL
  - DOMAIN-SUFFIX,codeload.github.com,FOREIGN-DL
  - DOMAIN-SUFFIX,gvt1.com,FOREIGN-DL
  - DOMAIN-SUFFIX,huggingface.co,FOREIGN-DL
  - DOMAIN-SUFFIX,cdn-lfs.huggingface.co,FOREIGN-DL
  - DOMAIN-SUFFIX,civitai.com,FOREIGN-DL
  - DOMAIN-SUFFIX,mega.nz,FOREIGN-DL
  - DOMAIN-SUFFIX,dropboxusercontent.com,FOREIGN-DL
  - DOMAIN-SUFFIX,mediafire.com,FOREIGN-DL
  - DOMAIN-SUFFIX,cdn-telegram.org,FOREIGN-DL

  # 音乐（Spotify）与 GitHub 网页/静态资源 → 普通 PROXY（Q2.1：永不限速，防误伤网页）
  - DOMAIN-SUFFIX,spotify.com,PROXY
  - DOMAIN-SUFFIX,scdn.co,PROXY
  - DOMAIN-SUFFIX,spotifycdn.com,PROXY
  - DOMAIN-SUFFIX,githubassets.com,PROXY
  - DOMAIN-SUFFIX,raw.githubusercontent.com,PROXY
  - DOMAIN-SUFFIX,githubusercontent.com,PROXY

  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT
  # 2026-11-17 兜底反转（用户拍板）：业务画像国内为主，未命中名单一律直连国内，
  # 防止 GeoIP/GeoSite 库缺新国内站被错送出国（昌乐 antdu/xxcg/hlquant 系列）。
  # 已知国外站由 geolocation-!cn 大名单（需 2026-11 版以上 GeoSite.dat）接住走代理。
  - GEOSITE,geolocation-!cn,PROXY
  - MATCH,DIRECT
